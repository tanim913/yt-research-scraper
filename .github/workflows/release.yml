name: Build apps

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run by hand to test the builds without making a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-13, name: macos-intel }
          - { os: macos-latest, name: macos-apple-silicon }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test
      - run: node build.js
      - name: Name the file
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mv "dist/yt-research-scraper$ext" "yt-research-scraper-${{ matrix.name }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: yt-research-scraper-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: apps, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: apps/*, generate_release_notes: true }
